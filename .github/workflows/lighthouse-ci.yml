name: Lighthouse CI

on:
  pull_request:
    branches: ["main", "dev"]
  push:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse Performance & SEO Audit
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_ENV: staging
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      INDEXING_ENABLED: false
      PRE_LAUNCH_MODE: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        id: build
        run: |
          for i in 1 2 3; do
            if npm run build; then
              echo "Build succeeded on attempt $i"
              exit 0
            fi
            echo "Build attempt $i failed"
            if [ "$i" -lt 3 ]; then
              echo "Retrying in 15s..."
              sleep 15
            fi
          done
          echo "Build failed after 3 attempts"
          exit 1

      - name: Start Next.js server for Lighthouse
        run: |
          nohup npm run start &>/tmp/next-server.log & echo $! > .next-server.pid
          npx wait-on --timeout 120000 --interval 2000 http://localhost:3000
        env:
          PORT: 3000

      - name: Run Lighthouse CI
        id: lighthouse
        run: |
          for i in 1 2 3; do
            if npx lhci autorun; then
              echo "Lighthouse CI succeeded on attempt $i"
              exit 0
            fi
            echo "Lighthouse CI attempt $i failed"
            if [ "$i" -lt 3 ]; then
              echo "Retrying in 20s..."
              sleep 20
            fi
          done
          echo "Lighthouse CI failed after 3 attempts"
          exit 1
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Stop Next.js server
        if: always()
        run: |
          if [ -f .next-server.pid ]; then
            kill "$(cat .next-server.pid)" || true
            rm -f .next-server.pid
          fi
